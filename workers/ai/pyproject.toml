[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "krama-ai"
version = "0.1.0"
description = "Krama AI worker: Temporal activities (task queue 'ai') behind a tiered model gateway"
requires-python = ">=3.11"
dependencies = [
  "temporalio==1.36.0",
  "boto3==1.44.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.2",
]

[project.scripts]
krama-ai-worker = "krama_ai.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/krama_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Data-heavy stub output and test fixtures read better on one line.
"src/krama_ai/providers/stub.py" = ["E501"]
"tests/*" = ["E501"]
