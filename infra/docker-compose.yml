# Krama — local / single-host stack (Kubernetes manifests come later).
#   cp .env.example .env          # from the repo root
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml run --rm api pnpm db:seed
# Web: http://localhost:3000   API docs: http://localhost:4000/api/docs
# Temporal UI: http://localhost:8080   MinIO console: http://localhost:9001
#
# TODO: mirror all images into Idealake's internal registry and pin by digest.

name: krama

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-krama}:${POSTGRES_PASSWORD:-krama}@postgres:5432/${POSTGRES_DB:-krama}?schema=public
  TEMPORAL_ADDRESS: temporal:7233
  KRAMA_API_URL: http://api:4000
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krama}
      POSTGRES_DB: ${POSTGRES_DB:-krama}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krama} -d ${POSTGRES_DB:-krama}"]
      interval: 5s
      retries: 20

  # Reserved for caching / rate limiting / session fan-out (not used by Phase 1 code yet).
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    # MinIO community images are published on quay.io; verify / mirror the tag internally.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-krama}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-krama-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-krama}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-krama-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-krama-sources}

  # Self-hosted Temporal backed by the same Postgres server (databases: temporal, temporal_visibility).
  # TODO: production uses the infra team's Temporal deployment (Helm) instead of auto-setup.
  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-krama}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-krama}
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.41.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    environment:
      <<: *app-env
      PORT: 4000
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      temporal: { condition: service_started }
    ports: ["4000:4000"]

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: ../.env
    environment:
      KRAMA_API_URL: http://api:4000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    depends_on: [api]
    ports: ["3000:3000"]

  ts-worker:
    build: { context: .., dockerfile: packages/workflows/Dockerfile }
    env_file: ../.env
    environment: *app-env
    depends_on: [temporal, api]

  ai-worker:
    build: { context: ../workers/ai }
    env_file: ../.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [temporal]

volumes:
  pgdata:
  miniodata:
