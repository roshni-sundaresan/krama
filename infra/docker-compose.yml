# Krama — local / single-host stack (Kubernetes manifests come later).
#   cp .env.example .env          # from the repo root
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml run --rm api pnpm db:seed
# Web: http://localhost:3000   API docs: http://localhost:4000/api/docs
# Temporal UI: http://localhost:8080
#
# TODO: mirror all images into Idealake's internal registry and pin by digest.

name: krama

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-krama}:${POSTGRES_PASSWORD:-krama}@postgres:5432/${POSTGRES_DB:-krama}?schema=public
  TEMPORAL_ADDRESS: temporal:7233
  KRAMA_API_URL: http://api:4000
  # Files are stored on the krama-files volume. Production can switch to S3 (STORAGE_DRIVER=s3).
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: /data/uploads

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krama}
      POSTGRES_DB: ${POSTGRES_DB:-krama}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krama} -d ${POSTGRES_DB:-krama}"]
      interval: 5s
      retries: 20

  # Self-hosted Temporal backed by the same Postgres server (databases: temporal, temporal_visibility).
  # TODO: production uses the infra team's Temporal deployment (Helm) instead of auto-setup.
  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-krama}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-krama}
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.41.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    environment:
      <<: *app-env
      PORT: 4000
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
    ports: ["4000:4000"]
    volumes: [krama-files:/data/uploads]

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: ../.env
    environment:
      KRAMA_API_URL: http://api:4000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    depends_on: [api]
    ports: ["3000:3000"]

  ts-worker:
    build: { context: .., dockerfile: packages/workflows/Dockerfile }
    env_file: ../.env
    environment: *app-env
    depends_on: [temporal, api]

  ai-worker:
    build: { context: ../workers/ai }
    env_file: ../.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [temporal]

volumes:
  pgdata:
  krama-files:
